set -g prefix C-a
#set -g default-terminal "screen-256color"
set -g default-terminal "tmux-256color"
#set -as terminal-features ',xterm-kitty:RGB'
set -g status-keys vi
#setw -g display-numbers on
set-window-option -g mode-keys vi

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set-option -g history-limit 10000

# Prefix stuff
unbind C-b
bind-key * set-window-option synchronize-panes
bind-key C-a last-window

# Vertical split window
bind-key - split-window -v

#set-window-option -g utf8 on # utf8 support

set-option -g set-titles on
set-option -g set-titles-string '#S:#I.#P #W' # window number,program name,active (or not)
set-window-option -g automatic-rename on # auto name


## status bar
set-option -g status-bg black
set-option -g status-fg colour250

set-option -g status-justify right
set-option -g status-interval 5
set-option -g status-left-length 30
set-option -g status-left '#[fg=#(hostname | hostcolor)]» #{host} #[fg=blue,bold]#[default] #{pane_width}x#{pane_height}'
set-option -g status-right '#[fg=cyan]»» #[fg=blue,bold]###S #[fg=magenta]%R %m-%d#(acpi | cut -d ',' -f 2)#[default]'
set-option -g visual-activity on
set-window-option -g monitor-activity off
set-window-option -g monitor-bell on
set-option -g visual-bell on
set-option -g bell-action any

set -g pane-border-status bottom
set-option -g pane-border-format "#{?#{!=:#{pane_title},#{host}},#{pane_title} | ,}#P: #(basename #{pane_current_path}) (#(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD))"

set -g renumber-windows on

bind-key C-f run-shell 'find-pane'


set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm' 
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

set -s set-clipboard on
set -g allow-passthrough on

set -gsa terminal-features 'xterm*:RGB'

bind-key -T copy-mode-vi Enter              send-keys -X copy-selection
#bind-key -T copy-mode-vi Enter              send-keys -X copy-pipe-and-cancel "copyq copy -"
bind-key -T copy-mode-vi y                  send-keys -X select-line
#bind-key ] run-shell "copyq clipboard | tmux load-buffer - && tmux paste-buffer"

run-shell ~/.tmux/plugins/tmux-thumbs/tmux-thumbs.tmux
set -g @thumbs-key 'v'
set -g @thumbs-command 'echo -n {} | copyq copy -'

set -s command-alias[7] qq='split-window "cl qq"; set -p remain-on-exit on'
bind-key space next-layout

bind-key J run-shell 'tmux join-pane -s "#{pane_id}" -t "#{@vimm_parent}"'
bind-key b break-pane

bind-key -n C-w kill-pane
